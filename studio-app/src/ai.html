<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>내 AI 연결</title>
<style>
  body { margin:0; background:#f6f8fa; color:#16202b; font-family:'Pretendard Variable','Malgun Gothic',sans-serif; }
  .wrap { padding:26px 24px; }
  h1 { margin:0 0 6px; font-size:20px; font-weight:800; }
  .lead { margin:0 0 18px; font-size:13px; line-height:1.7; color:#6b7684; word-break:keep-all; }
  .row { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #e8ecf0; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#cbd5e1; flex-shrink:0; }
  .dot.on { background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.2); }
  .name { font-size:15px; font-weight:800; }
  .sub { font-size:12px; color:#6b7684; margin-top:2px; }
  .sub.on { color:#16a34a; font-weight:700; }
  .row.on { border-color:#a7f3d0; background:#f0fdf4; }
  .grow { flex:1; min-width:0; }
  button { padding:9px 14px; border:0; border-radius:8px; background:#1a3a6b; color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }
  button:disabled { background:#cbd5e1; cursor:default; }
  button.ghost { background:#fff; color:#1a3a6b; border:1px solid #c7d2e3; }
  .msg { min-height:20px; margin:14px 2px 0; font-size:13px; color:#1a3a6b; line-height:1.6; word-break:keep-all; }
  .msg.err { color:#c53030; }
  .done { display:none; width:100%; margin-top:12px; padding:13px 0; font-size:15px; background:#16a34a; }
  .writer { background:#fff; border:1px solid #e8ecf0; border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .writer .t { font-size:13px; font-weight:800; margin-bottom:8px; }
  .writer .t span { font-weight:500; color:#6b7684; }
  .pills { display:flex; gap:8px; }
  .pill { flex:1; padding:10px 0; border-radius:10px; background:#fff; color:#16202b; border:1px solid #d5dce5; font-size:14px; font-weight:800; }
  .pill.on { background:#1a3a6b; color:#fff; border-color:#1a3a6b; }
  .pill:disabled { background:#f1f4f7; color:#a3adba; border-color:#e8ecf0; }
  .note { margin-top:16px; padding:12px 14px; border-radius:10px; background:#fff8eb; border:1px solid #fde4b0; font-size:12px; line-height:1.7; color:#7a4b00; word-break:keep-all; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>내 AI 연결</h1>
    <p class="lead">소장님이 구독 중인 AI로 기사·블로그를 씁니다. [연결하기]를 누르면 <b>스튜디오 전용 크롬</b>이 열립니다. 그 창에서 평소처럼 로그인한 뒤 그 줄의 <b>[로그인 다 했어요]</b>를 누르면 연결이 끝납니다. 비밀번호는 공실뉴스에 저장되지 않습니다.</p>
    <div class="writer" id="writer"></div>
    <div id="list"></div>
    <div class="msg" id="msg"></div>
    <div class="note">
      AI 회사 약관은 개인 계정의 자동 사용을 제한하고 있어, 계정이 제한될 수 있습니다. 스튜디오는 소장님이 버튼을 누를 때만 한 건씩 사람처럼 작성합니다.
      Gemini는 지메일·유튜브에 쓰는 업무용 구글 계정 말고 별도 계정을 권합니다.
    </div>
  </div>
<script>
  const studio = window.gongsilStudio;
  const msg = document.getElementById("msg");
  const say = (t, err) => { msg.textContent = t || ""; msg.className = "msg" + (err ? " err" : ""); };
  let busy = false;        // 확인·연결 중에는 다른 버튼을 잠근다 (동작이 겹치지 않게)
  let connectingId = null; // 로그인 창을 연 AI — 그 줄에 [로그인 다 했어요]를 띄운다
  const checking = new Set();

  /* 기본 글쓰기 AI — 연결된 것 중에서 고른다. 수정 요청은 처음 쓴 AI 로 이어서 간다 */
  function renderWriter(items) {
    const box = document.getElementById("writer");
    const writers = items.filter((x) => x.canWrite);
    box.innerHTML = '<div class="t">기본 글쓰기 AI <span>· 기사·블로그·SNS·유튜브를 이 AI로 씁니다</span></div><div class="pills"></div>';
    const pills = box.querySelector(".pills");
    for (const it of writers) {
      const b = document.createElement("button");
      b.className = "pill" + (it.isWriter ? " on" : "");
      b.textContent = it.name + (it.isWriter ? " ✓" : "");
      b.disabled = busy || !it.ok || !it.ready;
      b.title = !it.ready ? "준비 중입니다" : it.ok ? "" : "먼저 아래에서 연결해 주세요";
      b.onclick = async () => { if (it.isWriter) return; render(await studio.ai.setWriter(it.id)); say(`이제 ${it.name}로 글을 씁니다.${it.id !== "chatgpt" ? " 그림(AI 표지·시뮬레이션)은 ChatGPT로 그립니다." : ""}`); };
      pills.appendChild(b);
    }
  }

  function render(items) {
    renderWriter(items);
    const list = document.getElementById("list");
    list.innerHTML = "";
    for (const it of items) {
      const row = document.createElement("div");
      row.className = "row";
      const sub = !it.ready ? "준비 중"
        : connectingId === it.id ? "오른쪽 크롬 창에서 로그인해 주세요"
        : checking.has(it.id) ? "확인 중…"
        : it.ok ? `● 연결됨${it.account ? " · " + it.account : ""}${it.plan ? " (" + it.plan + ")" : ""}${it.noImage ? " · 글쓰기만 (그림은 못 그림)" : ""}`
        : "연결 안 됨";
      if (it.ok && connectingId !== it.id) row.classList.add("on");
      row.innerHTML = `<span class="dot ${it.ok ? "on" : ""}"></span><div class="grow"><div class="name"></div><div class="sub ${it.ok && connectingId !== it.id ? "on" : ""}"></div></div>`;
      row.querySelector(".name").textContent = it.name;
      row.querySelector(".sub").textContent = sub;
      const btn = document.createElement("button");
      if (connectingId === it.id) {
        btn.textContent = "로그인 다 했어요";
        btn.style.background = "#16a34a";
        btn.onclick = () => { btn.disabled = true; btn.textContent = "확인 중…"; studio.ai.finishLogin(); };
      } else {
        btn.textContent = it.ok ? "다시 확인" : "연결하기";
        if (it.ok) btn.className = "ghost";
        btn.disabled = !it.ready || busy;
        btn.onclick = () => (it.ok ? run(it.id, it.name, "check") : run(it.id, it.name, "connect"));
      }
      row.appendChild(btn);
      list.appendChild(row);
    }
  }

  async function load() { render(await studio.ai.list()); }

  async function run(id, name, how) {
    if (busy) return;
    busy = true;
    if (how === "connect") connectingId = id; else checking.add(id);
    await load();
    if (how === "check") say(`${name} 로그인을 확인하는 중…`);
    try {
      const r = await studio.ai[how](id);
      say(r && r.ok ? `${name} 연결이 끝났습니다.` : `${name} 로그인이 확인되지 않았습니다. 다시 [연결하기]를 눌러 주세요.`, !(r && r.ok));
    } catch (e) {
      say(String(e && e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, ""), true);
    }
    connectingId = null;
    checking.delete(id);
    busy = false;
    await load();
  }

  studio.ai.onProgress((t) => say(t));
  // 한 번도 확인하지 않은 AI는 창을 열 때 자동으로 확인한다 (이미 로그인되어 있을 수 있다)
  (async () => {
    const items = await studio.ai.list();
    render(items);
    for (const it of items.filter((x) => x.ready && !x.ok && !x.checkedAt)) await run(it.id, it.name, "check");
    if (!busy) say("");
  })();
</script>
</body>
</html>
