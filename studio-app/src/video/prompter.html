<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>프롬프터</title>
<style>
  :root { --a: 1; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Pretendard", "Malgun Gothic", sans-serif; user-select: none; }
  .wrap { position: relative; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; background: rgba(12, 13, 16, var(--a)); border: 1px solid #3a3f4b; color: #fff; overflow: hidden; }
  /* 위 줄을 잡고 끌어 옮긴다 — 마우스 모양은 ✥ 열십자 (윈도우 끌기 영역은 화살표만 돼서 직접 옮긴다) */
  .top { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; border-bottom: 1px solid #2a2e37; flex-shrink: 0; cursor: move; background: rgba(22, 24, 29, max(var(--a), 0.55)); }
  .grip { font-size: 18px; color: #aab0bb; }
  .title { flex: 1; font-size: 13.5px; font-weight: 700; color: #aab0bb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title b { color: #fff; }
  .tag { display: none; padding: 2px 8px; border-radius: 4px; background: #3b82f6; color: #fff; font-size: 12.5px; font-weight: 800; }
  .tb { height: 30px; padding: 0 12px; border-radius: 5px; border: 1px solid #4b5160; background: #1c1f26; color: #e5e7eb; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .tb:hover { background: #2d3240; }
  .olab { font-size: 12.5px; color: #aab0bb; white-space: nowrap; }
  input.op { flex: 0 0 90px; min-width: 70px; }
  .tb.mine { border-color: #3b82f6; }
  /* 윈도우 창처럼 — 작게 · 크게 · 닫기 */
  .wb { display: flex; margin-right: -6px; height: 40px; }
  .x { width: 44px; height: 40px; border: 0; background: transparent; color: #aab0bb; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .x:hover { background: #2d3240; color: #fff; }
  .x.cl:hover { background: #ef4444; color: #fff; }
  .view { position: relative; flex: 1; overflow: hidden; }
  /* 읽는 줄 — 위쪽 1/3 (카메라에 가깝게) */
  .guide { position: absolute; left: 0; right: 0; top: 33%; height: 0; border-top: 2px solid rgba(59, 130, 246, 0.85); z-index: 2; pointer-events: none; }
  .guide::before { content: "▶"; position: absolute; left: 4px; top: -13px; color: #3b82f6; font-size: 18px; }
  /* 바탕이 비쳐도 글자가 또렷하게 — 글자 둘레 그림자 */
  .text { position: absolute; left: 0; right: 0; top: 0; padding: 0 44px; white-space: pre-wrap; word-break: keep-all; line-height: 1.45; font-weight: 700; will-change: transform; text-shadow: 0 0 3px #000, 0 2px 8px rgba(0, 0, 0, 0.9); }
  /* 크기 조절 손잡이 (뒤가 비치는 창은 윈도우가 가장자리 끌기를 막아서 직접) */
  .grip { position: absolute; z-index: 9; }
  .grip.r { top: 40px; right: 0; bottom: 14px; width: 7px; cursor: ew-resize; }
  .grip.b { left: 0; right: 14px; bottom: 0; height: 7px; cursor: ns-resize; }
  .grip.rb { right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, #6b7280 50%, #6b7280 58%, transparent 58%, transparent 70%, #6b7280 70%, #6b7280 78%, transparent 78%); }
  .text span.l { display: block; color: rgba(255, 255, 255, 0.95); }
  .text span.l.past { color: rgba(255, 255, 255, 0.32); }
  .text span.gap { display: block; height: 0.7em; }
  .count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 120px; font-weight: 800; background: rgba(0, 0, 0, 0.55); z-index: 3; }
  .end { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; font-size: 22px; color: #aab0bb; display: none; z-index: 2; }
  .bar { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-top: 1px solid #2a2e37; flex-shrink: 0; }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .lab { font-size: 14px; color: #aab0bb; flex-shrink: 0; }
  .row.two { flex-wrap: nowrap; gap: 12px; }
  .half { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .half input[type=range] { min-width: 40px; }
  .vsep { width: 1px; align-self: stretch; background: #2a2e37; flex-shrink: 0; }
  button.b { height: 38px; padding: 0 12px; border-radius: 6px; border: 1px solid #4b5160; background: #1c1f26; color: #e5e7eb; font: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  button.b:hover { background: #2d3240; }
  button.b.main { background: #3b82f6; border-color: #3b82f6; color: #fff; min-width: 104px; }
  button.b.main:hover { background: #2563eb; }
  button.b.mine { border-color: #3b82f6; }
  input[type=range] { flex: 1; min-width: 90px; accent-color: #3b82f6; height: 26px; cursor: pointer; }
  .val { font-size: 14px; color: #fff; font-weight: 700; min-width: 64px; text-align: center; flex-shrink: 0; }
  .msg { font-size: 13px; color: #86efac; min-width: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="grip r" data-e="r"></div>
  <div class="grip b" data-e="b"></div>
  <div class="grip rb" data-e="rb" title="끌어서 크기 바꾸기"></div>
  <div class="top">
    <span class="grip">✥</span>
    <span class="tag" id="tag">미리 읽어 보기</span>
    <span class="title" title="녹화에 안 찍혀요 · 위 줄을 끌어 옮기고, 가장자리를 끌어 크기를 바꿔요"><b>프롬프터</b></span>
    <span class="msg" id="msg"></span>
    <span class="olab">투명도</span>
    <input type="range" id="opacity" class="op" min="0" max="1" step="0.05" title="바탕을 비치게 (글자는 그대로 · 녹화에는 안 찍혀요)" />
    <span class="wb">
      <button class="x" id="wmin" title="작게 (작업 표시줄로)"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="x" id="wmax" title="크게 (화면 가득)"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="x cl" id="close" title="프롬프터 닫기"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </span>
  </div>
  <div class="view" id="view">
    <div class="guide"></div>
    <div class="text" id="text"></div>
    <div class="end" id="end">— 대본 끝 —</div>
    <div class="count" id="count" style="display:none"></div>
  </div>
  <div class="bar">
    <div class="row" style="justify-content: flex-end">
      <button class="b main" id="play" title="멈추기·다시 (스페이스바)">⏸ 멈춤</button>
      <button class="b" id="back" title="조금 앞 줄로">⏪ 뒤로</button>
      <button class="b" id="again" title="처음부터 다시">⏮ 처음부터</button>
      <span class="vsep"></span>
      <button class="b" id="save" title="지금 빠르기·글자 크기를 내 설정으로 저장">설정 저장</button>
      <button class="b mine" id="mine" title="저장한 내 빠르기·글자 크기로">★ 내 설정</button>
    </div>
    <!-- 빠르기 · 글자 크기 — 한 줄에 반씩 -->
    <div class="row two">
      <div class="half">
        <span class="lab">빠르기</span>
        <button class="b" id="slower">느리게</button>
        <input type="range" id="speed" min="3" max="8" step="0.5" />
        <button class="b" id="faster">빠르게</button>
        <span class="val" id="speedName"></span>
      </div>
      <span class="vsep"></span>
      <div class="half">
        <span class="lab">글자</span>
        <button class="b" id="smaller">가 작게</button>
        <input type="range" id="size" min="28" max="96" step="2" />
        <button class="b" id="bigger">가 크게</button>
        <span class="val" id="sizeName"></span>
      </div>
    </div>
  </div>
</div>
<script>
  // 1초에 읽는 글자 수(cps)로 올라간다. 처음 값은 녹화 창에서 고른 빠르기. 바꾼 빠르기·글자 크기는 녹화 창에 알려 다음에도 그대로
  const SPEED_NAME = (v) => (v <= 3.5 ? "아주 느리게" : v <= 4.5 ? "느리게" : v <= 5.5 ? "보통" : v <= 6.5 ? "빠르게" : "아주 빠르게");
  const SIZE_NAME = (v) => (v <= 38 ? "작게" : v <= 58 ? "보통" : v <= 76 ? "크게" : "아주 크게");
  const $ = (id) => document.getElementById(id);
  const view = $("view"), text = $("text");
  let cps = 5, size = 52, opacity = 1, mine = null, y = 0, playing = false, last = 0, startAt = 0, chars = 1, lines = [];

  const render = (script) => {
    text.innerHTML = "";
    lines = [];
    for (const block of String(script || "").replace(/\r/g, "").split(/\n\s*\n/)) {
      const ls = block.split("\n").map((s) => s.trim()).filter(Boolean);
      if (!ls.length) continue;
      if (text.childNodes.length) {
        const g = document.createElement("span");
        g.className = "gap";
        text.appendChild(g);
      }
      for (const l of ls) {
        const el = document.createElement("span");
        el.className = "l";
        el.textContent = l;
        text.appendChild(el);
        lines.push(el);
      }
    }
    chars = Math.max(1, String(script || "").replace(/\s/g, "").length);
  };
  const guideY = () => view.clientHeight * 0.33;
  // 높이·줄 위치는 대본·글자 크기·창 크기가 바뀔 때만 잰다 (매 화면마다 재면 버벅인다)
  let H = 1, G = 0, ends = [], pastN = -1, ended = null;
  const measure = () => {
    H = text.scrollHeight || 1;
    G = view.clientHeight * 0.33;
    ends = lines.map((el) => el.offsetTop + el.offsetHeight);
    pastN = -1;
  };
  const maxY = () => Math.max(0, H - 10);
  const apply = () => {
    y = Math.min(Math.max(0, y), maxY());
    // 첫 줄 윗부분이 읽는 줄에 오게 시작 — 그래픽 카드로 옮긴다
    text.style.transform = `translate3d(0, ${(G - size * 0.75 - y).toFixed(1)}px, 0)`;
    const g = y + size * 0.75 - 4;
    let n = 0;
    while (n < ends.length && ends[n] < g) n++;
    if (n !== pastN) {
      for (let i = 0; i < lines.length; i++) lines[i].classList.toggle("past", i < n);
      pastN = n;
    }
    const e = y >= maxY() - 2;
    if (e !== ended) $("end").style.display = (ended = e) ? "block" : "none";
  };
  let flash = 0;
  const say = (t) => {
    $("msg").textContent = t;
    clearTimeout(flash);
    flash = setTimeout(() => ($("msg").textContent = ""), 2500);
  };
  const report = () => window.prompter.prefs && window.prompter.prefs({ cps, size, opacity, mine });
  // 투명도 — 창 전체를 비치게 (뒤 화면을 보면서 읽게)
  // 투명도 — 바탕만 비치게 (글자·단추는 선명하게 그대로). 0 = 바탕 없음
  const setOpacity = (v, tell = true) => {
    const n = Number(v);
    opacity = Math.min(1, Math.max(0, Number.isFinite(n) ? n : 1));
    $("opacity").value = opacity;
    document.documentElement.style.setProperty("--a", String(opacity));
    if (tell) report();
  };
  const setSpeed = (v, tell = true) => {
    cps = Math.min(8, Math.max(3, Math.round(v * 2) / 2));
    $("speed").value = cps;
    $("speedName").textContent = SPEED_NAME(cps);
    showMine();
    if (tell) report();
  };
  // 내 설정 = 저장한 빠르기 + 글자 크기
  const showMine = () => {
    $("mine").style.display = mine ? "" : "none";
    $("mine").style.background = mine && mine.cps === cps && mine.size === size ? "#1e3a8a" : "";
  };
  const setSize = (v, tell = true) => {
    // 크기를 바꿔도 읽던 자리는 그대로
    const k = y / H;
    size = Math.min(96, Math.max(28, Math.round(v / 2) * 2));
    text.style.fontSize = size + "px";
    $("size").value = size;
    $("sizeName").textContent = SIZE_NAME(size);
    showMine();
    measure();
    y = k * H;
    apply();
    if (tell) report();
  };
  const setPlaying = (v) => {
    playing = v;
    $("play").textContent = v ? "⏸ 멈춤" : "▶ 다시";
    last = performance.now();
  };
  const countFrom = (ms) => {
    startAt = Date.now() + ms;
    setPlaying(false);
  };
  const tick = (now) => {
    if (startAt) {
      const left = Math.ceil((startAt - Date.now()) / 1000);
      if (left > 0) {
        $("count").style.display = "flex";
        $("count").textContent = left;
      } else {
        $("count").style.display = "none";
        startAt = 0;
        setPlaying(true);
      }
    } else if (playing) {
      // 1초에 cps 글자 → 글자 하나가 차지하는 높이 × cps 만큼
      const dt = Math.min(0.1, (now - last) / 1000);
      y += (H / chars) * cps * dt;
      apply();
    }
    last = now;
    requestAnimationFrame(tick);
  };

  $("play").onclick = () => {
    if (startAt) (startAt = 0), ($("count").style.display = "none");
    setPlaying(!playing);
  };
  $("back").onclick = () => {
    y -= size * 1.45 * 2;
    apply();
  };
  $("again").onclick = () => {
    y = 0;
    apply();
    countFrom(3000);
  };
  $("slower").onclick = () => setSpeed(cps - 0.5);
  $("faster").onclick = () => setSpeed(cps + 0.5);
  $("speed").oninput = (e) => setSpeed(Number(e.target.value));
  $("mine").onclick = () => {
    if (!mine) return;
    setSpeed(mine.cps, false);
    setSize(mine.size);
    say("내 설정으로 바꿨어요");
  };
  $("save").onclick = () => {
    mine = { cps, size };
    showMine();
    report();
    say("설정을 저장했어요");
  };
  $("mine").addEventListener("pointerdown", (e) => e.stopPropagation());
  $("save").addEventListener("pointerdown", (e) => e.stopPropagation());
  $("opacity").oninput = (e) => setOpacity(e.target.value);
  // 크기 조절 — 손잡이를 끄는 만큼 (오른쪽·아래·모서리)
  document.querySelectorAll(".grip").forEach((g) => g.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.stopPropagation();
    g.setPointerCapture(e.pointerId);
    const sx = e.screenX, sy = e.screenY, edge = g.dataset.e;
    window.prompter.resizeStart && window.prompter.resizeStart();
    const mv = (ev) => window.prompter.resize(edge === "b" ? 0 : ev.screenX - sx, edge === "r" ? 0 : ev.screenY - sy);
    const up = () => {
      g.removeEventListener("pointermove", mv);
      g.removeEventListener("pointerup", up);
    };
    g.addEventListener("pointermove", mv);
    g.addEventListener("pointerup", up);
  }));
  $("opacity").addEventListener("pointerdown", (e) => e.stopPropagation());
  $("smaller").onclick = () => setSize(size - 6);
  $("bigger").onclick = () => setSize(size + 6);
  $("size").oninput = (e) => setSize(Number(e.target.value));
  $("close").onclick = () => window.prompter.close();
  // 위 줄 끌어 옮기기
  for (const id of ["close", "wmin", "wmax"]) $(id).addEventListener("pointerdown", (e) => e.stopPropagation());
  const MAX_ICON = '<svg width="16" height="16" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>', RES_ICON = '<svg width="16" height="16" viewBox="0 0 16 16"><rect x="3.5" y="5.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 5.5V3.5h7v7h-2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
  let big = false;
  const toggleBig = async () => {
    big = await window.prompter.max();
    $("wmax").innerHTML = big ? RES_ICON : MAX_ICON;
    $("wmax").title = big ? "원래 크기로" : "크게 (화면 가득)";
    document.querySelector(".top").style.cursor = big ? "default" : "move";
  };
  $("wmin").onclick = () => window.prompter.min();
  $("wmax").onclick = toggleBig;
  // 위 줄 두 번 누르기 = 크게/원래대로 (윈도우처럼)
  document.querySelector(".top").addEventListener("dblclick", (e) => {
    if (!e.target.closest("button")) toggleBig();
  });
  document.querySelector(".top").addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || big) return; // 크게 한 동안은 옮기지 않는다
    const top = e.currentTarget;
    top.setPointerCapture(e.pointerId);
    const sx = e.screenX, sy = e.screenY;
    window.prompter.dragStart();
    const move = (ev) => window.prompter.drag(ev.screenX - sx, ev.screenY - sy);
    const up = () => {
      top.removeEventListener("pointermove", move);
      top.removeEventListener("pointerup", up);
    };
    top.addEventListener("pointermove", move);
    top.addEventListener("pointerup", up);
  });
  // 손으로 굴려서 맞추기 (마우스 휠)
  view.addEventListener("wheel", (e) => {
    y += e.deltaY * 0.6;
    apply();
  });
  document.addEventListener("keydown", (e) => {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.code === "Space") {
      e.preventDefault();
      $("play").click();
    } else if (e.key === "ArrowUp") $("back").click();
    else if (e.key === "ArrowDown") (y += size * 1.45), apply();
  });
  window.addEventListener("resize", () => {
    const k = y / H;
    measure();
    y = k * H;
    apply();
  });

  window.prompter.init().then((o) => {
    o = o || {};
    if (o.rehearse) $("tag").style.display = "inline-block";
    render(o.text);
    mine = o.mine && o.mine.cps ? { cps: Number(o.mine.cps), size: Number(o.mine.size) || 52 } : null;
    setSpeed(Number(o.cps) || 5, false);
    setSize(Number(o.size) || 52, false);
    setOpacity(typeof o.opacity === "number" ? o.opacity : 1, false);
    startAt = Number(o.startAt) || 0;
    if (!startAt) setPlaying(true);
    requestAnimationFrame(tick);
  });
</script>
</body>
</html>
