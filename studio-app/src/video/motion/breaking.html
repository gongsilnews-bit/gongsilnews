<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 인트로 ④ 속보형 — 뉴스 자막처럼 "신규 매물" 딱지와 아래 띠가 밀려 들어오고, 흐르는 글줄 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,.75) 100%); }
  #lower { position: absolute; left: 0; right: 0; }
  #tagRow { display: flex; align-items: stretch; margin-left: var(--pad); }
  #tag { background: var(--accent); font-size: calc(var(--u) * 5); font-weight: 900; padding: calc(var(--u) * 1) calc(var(--u) * 2.6); letter-spacing: .04em; transform-origin: left center; }
  #live { background: #fff; color: #111; font-size: calc(var(--u) * 4); font-weight: 900; padding: calc(var(--u) * 1.3) calc(var(--u) * 2); display: flex; align-items: center; gap: calc(var(--u) * 1); transform-origin: left center; }
  #dot { width: calc(var(--u) * 2); height: calc(var(--u) * 2); border-radius: 50%; background: var(--accent); }
  #band { margin-top: calc(var(--u) * .6); background: rgba(10,14,24,.92); border-left: calc(var(--u) * 1.6) solid var(--accent); padding: calc(var(--u) * 2.4) var(--pad); transform-origin: left center; }
  #head { font-size: calc(var(--u) * 7.6); font-weight: 900; line-height: 1.2; letter-spacing: -.02em; }
  #sub { font-size: calc(var(--u) * 4.4); font-weight: 700; margin-top: calc(var(--u) * 1); color: #dfe6f2; }
  #ticker { background: var(--accent); overflow: hidden; white-space: nowrap; font-size: calc(var(--u) * 3.8); font-weight: 800; padding: calc(var(--u) * 1) 0; }
  #tickerIn { display: inline-block; padding-left: 100%; }
  #brand { position: absolute; right: var(--pad); top: var(--pad); font-size: calc(var(--u) * 3.6); font-weight: 800; background: rgba(0,0,0,.45); padding: calc(var(--u) * .6) calc(var(--u) * 1.6); border-radius: calc(var(--u) * .6); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="shade"></div><div id="brand"></div>
  <div id="lower">
    <div id="tagRow"><div id="tag">신규 매물</div><div id="live"><span id="dot"></span><span id="liveT">공실뉴스</span></div></div>
    <div id="band"><div id="head"></div><div id="sub"></div></div>
    <div id="ticker"><span id="tickerIn"></span></div>
  </div>
</div>
<script src="base.js"></script>
<script>
  const { $, seg, outCubic, outExpo } = M;
  window.__SFX = [{ t: 0.05, name: "notification", vol: 0.7 }, { t: 0.35, name: "whoosh-short", vol: 0.6 }, { t: 0.7, name: "whoosh", vol: 0.5 }, { t: 1.1, name: "typing", vol: 0.3 }, { t: 1.9, name: "click", vol: 0.4 }];
  window.__setup = async (data) => {
    const p = M.setup(data);
    const D = M.D, u = M.u;
    await M.bg($("bg"));
    $("head").textContent = [D.place, D.kind].filter(Boolean).join(" ");
    $("tag").textContent = D.trade || D.price ? "신규 매물" : "새 소식"; // 매물이 아니면 (뉴스칼럼 등)
    $("sub").textContent = [D.trade, D.price].filter(Boolean).join(" ");
    $("tickerIn").textContent = [...(D.chips || []), D.brand ? `문의 ${D.brand}` : ""].filter(Boolean).join("     ●     ");
    M.text("brand", D.brand);
    $("lower").style.bottom = (M.vertical ? u * 30 : u * 6) + "px";
    await p;
    await window.__seek(0);
  };
  window.__seek = async (t) => {
    await M.bgSeek(t);
    $("bg").style.transform = `scale(${1.08 - 0.06 * seg(t, 0, 3)})`;
    const a = outExpo(seg(t, 0.0, 0.4));
    $("tag").style.transform = `scaleX(${a})`;
    $("live").style.transform = `scaleX(${outExpo(seg(t, 0.25, 0.6))})`;
    $("dot").style.opacity = String(Math.floor(t * 3) % 2 ? 0.35 : 1);
    $("band").style.transform = `scaleX(${outExpo(seg(t, 0.35, 0.8))})`;
    const h = outCubic(seg(t, 0.7, 1.1));
    $("head").style.opacity = String(h); $("head").style.transform = `translateY(${(1 - h) * 20}px)`;
    // 거래·가격은 한 글자씩 (타자)
    const sub = $("sub"), full = [M.D.trade, M.D.price].filter(Boolean).join(" ");
    sub.textContent = full.slice(0, Math.round(full.length * seg(t, 1.1, 1.6)));
    $("ticker").style.opacity = String(seg(t, 1.6, 1.8));
    $("tickerIn").style.transform = `translateX(${-seg(t, 1.6, 3.0) * 100}%)`;
    $("brand").style.opacity = String(seg(t, 0.4, 0.8));
  };
</script>
</body>
</html>
