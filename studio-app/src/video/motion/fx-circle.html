<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 강조 · 빨간 동그라미 — 문구가 나오고 강조 낱말 둘레에 손으로 그린 빨간 원, 화살표가 찌른다 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #shade { position: absolute; inset: 0; }
  .hl { color: var(--accent); }
  #shade { background: rgba(0,0,0,.25); }
  #t { position: absolute; left: var(--pad); right: var(--pad); font-size: calc(var(--u) * 10); font-weight: 900; line-height: 1.25; text-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #t .hl { color: #fff; position: relative; }
  svg#ink { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="shade"></div><div id="t"></div><svg id="ink"><path id="ring" fill="none" stroke="#ff2d2d" stroke-width="10" stroke-linecap="round"></path><path id="arrow" fill="none" stroke="#ff2d2d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
<script src="vendor/anime.umd.min.js"></script>
<script src="base.js"></script>
<script src="scene-common.js"></script>
<script>
  const { $ } = M;
  const { stagger } = anime;
  window.__SFX = [{ t: 0.1, name: "whoosh-short", vol: 0.5 }, { t: 0.6, name: "whoosh", vol: 0.5 }, { t: 1.15, name: "pop", vol: 0.7 }];
  window.__setup = async (data) => {
    await S.start(data); const tl = S.tl; const D = M.D, u = M.u, V = M.vertical;
    const ws = S.words($("t"), D.title, D.highlight);
    $("t").style.top = (V ? M.H * 0.22 : M.H * 0.28) + "px";
    $("ink").setAttribute("viewBox", `0 0 ${M.W} ${M.H}`);
    const target = ws.find((w) => w.classList.contains("hl")) || ws[ws.length - 1];
    const sr = $("stage").getBoundingClientRect(), r = target ? target.getBoundingClientRect() : { left: M.W / 3, top: M.H / 3, width: u * 20, height: u * 10 };
    const cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height / 2, rx = r.width / 2 + u * 4, ry = r.height / 2 + u * 3;
    $("ring").setAttribute("d", `M ${cx - rx} ${cy} C ${cx - rx} ${cy - ry * 1.3}, ${cx + rx} ${cy - ry * 1.4}, ${cx + rx} ${cy} S ${cx - rx * .6} ${cy + ry * 1.5}, ${cx - rx * 1.05} ${cy - ry * .2}`);
    const ax = cx + rx + u * 14, ay = cy + ry + u * 18;
    $("arrow").setAttribute("d", `M ${ax} ${ay} L ${cx + rx * .7} ${cy + ry * .9} M ${cx + rx * .7 + u * 6} ${cy + ry * .9} L ${cx + rx * .7} ${cy + ry * .9} L ${cx + rx * .7} ${cy + ry * .9 + u * 6}`);
    S.hide(ws);
    const [dr] = anime.svg.createDrawable($("ring")), [da] = anime.svg.createDrawable($("arrow"));
    anime.utils.set([dr, da], { draw: "0 0" });
    tl.add(ws, { opacity: [0, 1], y: [u * 3, 0], duration: 400, delay: stagger(80) }, 100)
      .add(dr, { draw: ["0 0", "0 1"], duration: 600, ease: "inOutQuad" }, 600)
      .add(da, { draw: ["0 0", "0 1"], duration: 400, ease: "outQuad" }, 1150)
      .add(target || $("t"), { scale: [1, 1.08, 1], duration: 400 }, 1150);
    await window.__seek(0);
  };
</script>
</body>
</html>
