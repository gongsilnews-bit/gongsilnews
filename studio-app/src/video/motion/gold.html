<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 인트로 ⑤ 고급형 — 어두운 바탕에 금빛 선이 그어지고 글자가 넓게 퍼졌다 모이며 나타난다 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #0c0f18; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #f5ecd7; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,10,18,.82) 0%, rgba(8,10,18,.55) 50%, rgba(8,10,18,.88) 100%); }
  #frame { position: absolute; inset: calc(var(--pad) * .7); border: calc(var(--u) * .3) solid var(--gold); opacity: .0; }
  #wrap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; padding: 0 var(--pad); }
  .line { height: calc(var(--u) * .35); background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0 auto; width: 70%; }
  #place { font-size: calc(var(--u) * 4.2); font-weight: 700; letter-spacing: .5em; color: var(--gold); margin: calc(var(--u) * 3) 0 calc(var(--u) * 1.2); }
  #kind { font-size: calc(var(--u) * 10); font-weight: 900; line-height: 1.15; }
  #price { font-size: calc(var(--u) * 15); font-weight: 900; color: var(--gold); margin: calc(var(--u) * 2) 0 calc(var(--u) * 3); letter-spacing: -.02em; text-shadow: 0 0 calc(var(--u) * 4) rgba(212,175,55,.35); }
  #trade { font-size: calc(var(--u) * 4.6); font-weight: 800; letter-spacing: .3em; }
  #chips { margin-top: calc(var(--u) * 3); font-size: calc(var(--u) * 3.8); font-weight: 600; letter-spacing: .08em; opacity: .9; }
  #brand { position: absolute; left: 0; right: 0; bottom: calc(var(--pad) * 1.3); text-align: center; font-size: calc(var(--u) * 3.4); font-weight: 700; letter-spacing: .3em; color: var(--gold); }
  .spark { position: absolute; width: calc(var(--u) * 1.2); height: calc(var(--u) * 1.2); background: radial-gradient(circle, #fff 0%, var(--gold) 40%, transparent 70%); border-radius: 50%; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="shade"></div><div id="frame"></div>
  <div id="wrap">
    <div class="line" id="l1"></div>
    <div id="place"></div><div id="trade"></div><div id="kind"></div><div id="price"></div>
    <div class="line" id="l2"></div>
    <div id="chips"></div>
  </div>
  <div id="brand"></div>
</div>
<script src="base.js"></script>
<script>
  const { $, seg, outCubic, inOut } = M;
  window.__SFX = [{ t: 0.1, name: "chime", vol: 0.6 }, { t: 0.9, name: "whoosh", vol: 0.4 }, { t: 1.3, name: "sparkle", vol: 0.7 }, { t: 2.0, name: "chime", vol: 0.35 }];
  let sparks = [];
  window.__setup = async (data) => {
    const p = M.setup(data);
    const D = M.D;
    $("stage").style.setProperty("--gold", D.accent && D.accent !== "#E8590C" ? D.accent : "#D4AF37"); // 고급형은 금색이 기본
    await M.bg($("bg"));
    M.text("place", D.place); M.text("kind", D.kind); M.text("trade", D.trade); M.text("price", D.price); M.text("brand", D.brand);
    $("chips").textContent = (D.chips || []).slice(0, 3).join("   |   ");
    for (let i = 0; i < 10; i++) { const s = document.createElement("div"); s.className = "spark"; $("stage").appendChild(s); sparks.push({ el: s, x: (i * 37) % 100, y: 30 + ((i * 53) % 40), d: (i % 5) * 0.12 }); }
    await p;
    await window.__seek(0);
  };
  window.__seek = async (t) => {
    await M.bgSeek(t);
    $("bg").style.transform = `scale(${1.1 - 0.06 * seg(t, 0, 3)})`;
    $("bg").style.filter = `grayscale(.35) brightness(${0.6 + 0.2 * seg(t, 0, 1)})`;
    $("frame").style.opacity = String(0.55 * outCubic(seg(t, 0.1, 0.8)));
    $("l1").style.transform = `scaleX(${inOut(seg(t, 0.15, 0.7))})`;
    $("l2").style.transform = `scaleX(${inOut(seg(t, 1.2, 1.7))})`;
    // 글자 — 넓게 퍼졌다 모이며 (자간)
    const ap = (id, a, b, from) => { const q = outCubic(seg(t, a, b)); $(id).style.opacity = String(q); $(id).style.letterSpacing = `${from * (1 - q)}em`; };
    ap("place", 0.35, 0.9, 1.2); ap("trade", 0.5, 1.0, 1.0); ap("kind", 0.65, 1.2, 0.5); ap("price", 0.95, 1.5, 0.4); ap("chips", 1.6, 2.1, 0.4);
    $("price").style.transform = `scale(${0.92 + 0.08 * outCubic(seg(t, 0.95, 1.5))})`;
    $("brand").style.opacity = String(seg(t, 1.8, 2.3));
    // 반짝 — 가격이 나올 때 흩어지며 사라짐
    sparks.forEach((s) => { const q = seg(t, 1.25 + s.d, 1.95 + s.d); s.el.style.left = s.x + "%"; s.el.style.top = s.y - q * 8 + "%"; s.el.style.opacity = String(q > 0 && q < 1 ? Math.sin(Math.PI * q) : 0); s.el.style.transform = `scale(${0.5 + q * 1.5})`; });
  };
</script>
</body>
</html>
