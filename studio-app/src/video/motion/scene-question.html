<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 장면 · 질문 카드 — 큰 물음표가 흔들리며 등장, 질문 문구가 튀어나온다 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #shade { position: absolute; inset: 0; }
  .hl { color: var(--accent); }
  #shade { background: linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.25)); }
  #mark { position: absolute; right: var(--pad); font-size: calc(var(--u) * 40); font-weight: 900; color: var(--accent); opacity: .9; line-height: 1; }
  #t { position: absolute; left: var(--pad); right: calc(var(--pad) * 2.5); font-size: calc(var(--u) * 10); font-weight: 900; line-height: 1.2; text-shadow: 0 4px 20px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="shade"></div><div id="mark">?</div><div id="t"></div></div>
<script src="vendor/anime.umd.min.js"></script>
<script src="base.js"></script>
<script src="scene-common.js"></script>
<script>
  const { $ } = M;
  const { stagger } = anime;
  window.__SFX = [{ t: 0.1, name: "pop", vol: 0.7 }, { t: 0.5, name: "whoosh-short", vol: 0.5 }];
  window.__setup = async (data) => {
    await S.start(data); const tl = S.tl; const D = M.D, u = M.u, V = M.vertical;
    const ws = S.words($("t"), D.title, D.highlight);
    $("mark").style.top = (V ? M.H * 0.12 : M.H * 0.08) + "px"; $("t").style.top = (V ? M.H * 0.2 : M.H * 0.22) + "px";
    S.hide($("mark"), ws);
    tl.add($("mark"), { opacity: [0, 0.9], scale: [0.2, 1], rotate: [-30, 0], duration: 700, ease: "outBack(2.4)" }, 50)
      .add($("mark"), { rotate: [0, 8, -6, 0], duration: 900, ease: "inOutSine" }, 800)
      .add(ws, { opacity: [0, 1], scale: [0.6, 1], duration: 500, delay: stagger(100), ease: "outBack(1.8)" }, 400);
    await window.__seek(0);
  };
</script>
</body>
</html>
