<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 인트로 ⑪ 도장 — 사진 위에 거래 종류 도장이 쾅 찍히고(살짝 기울어), 아래 띠에 정보가 들어온다 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #111; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.2) 45%, rgba(0,0,0,.8) 100%); }
  #stampWrap { position: absolute; left: 50%; top: 34%; }
  #stamp { border: calc(var(--u) * 1.4) solid var(--accent); color: var(--accent); border-radius: calc(var(--u) * 2.4); padding: calc(var(--u) * 1.5) calc(var(--u) * 5); font-size: calc(var(--u) * 15); font-weight: 900; letter-spacing: .05em; background: rgba(255,255,255,.88); white-space: nowrap; transform: translate(-50%, -50%) rotate(-10deg); box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 4) rgba(0,0,0,.35); }
  #band { position: absolute; left: 0; right: 0; padding: calc(var(--u) * 3) var(--pad); background: rgba(10,10,14,.85); border-top: calc(var(--u) * .8) solid var(--accent); }
  #kind { font-size: calc(var(--u) * 7.5); font-weight: 900; }
  #row { display: flex; align-items: baseline; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * .6); }
  #place { font-size: calc(var(--u) * 4.4); font-weight: 700; color: #ddd; }
  #price { font-size: calc(var(--u) * 11); font-weight: 900; color: #fff; }
  #chips { font-size: calc(var(--u) * 3.8); font-weight: 700; color: #ccc; margin-top: calc(var(--u) * 1); }
  #brand { position: absolute; right: var(--pad); top: var(--pad); font-size: calc(var(--u) * 3.6); font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="shade"></div><div id="brand"></div>
  <div id="stampWrap"><div id="stamp"></div></div>
  <div id="band"><div id="kind"></div><div id="row"><div id="price"></div><div id="place"></div></div><div id="chips"></div></div>
</div>
<script src="base.js"></script>
<script>
  const { $, seg, outCubic, outBack } = M;
  const HIT = 0.55;
  window.__SFX = [{ t: 0.2, name: "whoosh", vol: 0.5 }, { t: HIT, name: "impact-bass-1", vol: 0.9 }, { t: 1.0, name: "whoosh-short", vol: 0.5 }, { t: 1.4, name: "pop", vol: 0.6 }];
  window.__setup = async (data) => {
    const p = M.setup(data); const D = M.D, u = M.u;
    await M.bg($("bg"));
    $("stamp").textContent = D.trade || "추천";
    M.text("kind", D.kind); M.text("place", D.place); M.text("price", D.price); M.text("brand", D.brand);
    $("chips").textContent = (D.chips || []).slice(0, 3).join("  ·  ");
    $("band").style.bottom = (M.vertical ? u * 28 : u * 6) + "px";
    if (!M.vertical) $("stampWrap").style.top = "30%";
    await p; await window.__seek(0);
  };
  window.__seek = async (t) => {
    await M.bgSeek(t);
    $("bg").style.transform = `scale(${1.1 - 0.06 * seg(t, 0, 3)})`;
    // 도장 — 크게 떠 있다가 HIT 에 쾅 (눌렸다 살짝 튀어나옴)
    const d = seg(t, 0.2, HIT);
    const after = seg(t, HIT, HIT + 0.25);
    const sc = t < HIT ? 2.4 - 1.4 * d * d : 1 - 0.06 * Math.sin(Math.PI * after);
    $("stamp").style.opacity = String(seg(t, 0.2, 0.3));
    $("stamp").style.transform = `translate(-50%, -50%) rotate(-10deg) scale(${sc})`;
    const sh = t >= HIT && t < HIT + 0.2 ? (1 - after) * M.u * 1.2 : 0;
    $("bg").style.translate = `${Math.sin(t * 80) * sh}px ${Math.cos(t * 60) * sh}px`;
    const b = outCubic(seg(t, 1.0, 1.4));
    $("band").style.opacity = String(b); $("band").style.transform = `translateY(${(1 - b) * 60}px)`;
    const c = outBack(seg(t, 1.3, 1.7));
    $("price").style.transform = `scale(${0.7 + 0.3 * c})`; $("price").style.transformOrigin = "left bottom";
    $("brand").style.opacity = String(seg(t, 1.2, 1.6));
  };
</script>
</body>
</html>
