<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 인트로 ① 기본 (핀형) — 핀이 떨어지고 동네 → 종류 → 거래·가격 → 칩. 규칙: base.js -->
<style>
  html, body { margin: 0; overflow: hidden; background: #0b1220; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; transform-origin: 50% 55%; overflow: hidden; }
  #shade, #sweep { position: absolute; inset: 0; }
  #sweep { background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.10) 50%, transparent 60%); }
  .abs { position: absolute; left: var(--pad); right: var(--pad); }
  #placeRow { display: flex; align-items: center; gap: calc(var(--u) * 1.2); }
  #pin { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--accent); flex-shrink: 0; position: relative; }
  #pin::after { content: ""; position: absolute; inset: 28%; border-radius: 50%; background: #fff; }
  #place { font-size: calc(var(--u) * 5); font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .mask { overflow: hidden; padding-bottom: .08em; }
  #kind { font-size: calc(var(--u) * 11.5); font-weight: 900; line-height: 1.12; letter-spacing: -.03em; text-shadow: 0 4px 24px rgba(0,0,0,.5); display: inline-block; }
  #priceRow { display: flex; align-items: baseline; gap: calc(var(--u) * 1.6); margin-top: calc(var(--u) * 1.6); }
  #trade { font-size: calc(var(--u) * 6); font-weight: 900; padding: calc(var(--u) * .6) calc(var(--u) * 2); border-radius: calc(var(--u) * .9); background: var(--accent); }
  #price { font-size: calc(var(--u) * 17); font-weight: 900; letter-spacing: -.04em; line-height: 1; text-shadow: 0 6px 30px rgba(0,0,0,.55); transform-origin: left bottom; }
  #bar { height: calc(var(--u) * .9); width: calc(var(--u) * 26); margin-top: calc(var(--u) * 2.4); background: var(--accent); border-radius: 99px; transform-origin: left center; }
  #chips { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1.2); margin-top: calc(var(--u) * 3); }
  .chip { font-size: calc(var(--u) * 4.2); font-weight: 800; padding: calc(var(--u) * .7) calc(var(--u) * 1.8); border-radius: 99px; background: rgba(255,255,255,.14); border: calc(var(--u) * .22) solid rgba(255,255,255,.55); white-space: nowrap; }
  #brand { position: absolute; right: var(--pad); top: var(--pad); font-size: calc(var(--u) * 3.6); font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="shade"></div><div id="sweep"></div>
  <div id="brand"></div>
  <div class="abs" id="top"><div id="placeRow"><div id="pin"></div><div id="place"></div></div></div>
  <div class="abs" id="mid">
    <div class="mask"><div id="kind"></div></div>
    <div id="priceRow"><div id="trade"></div><div class="mask"><div id="price"></div></div></div>
    <div id="bar"></div>
    <div id="chips"></div>
  </div>
</div>
<script src="base.js"></script>
<script>
  const { $, seg, outCubic, outBack, inOut } = M;
  let chips = [];
  window.__SFX = [{ t: 0.15, name: "whoosh-short", vol: 0.6 }, { t: 0.85, name: "pop", vol: 0.8 }, { t: 1.0, name: "whoosh", vol: 0.5 }, { t: 1.4, name: "sparkle", vol: 0.5 }, { t: 1.6, name: "click", vol: 0.5 }, { t: 1.75, name: "click", vol: 0.5 }, { t: 1.9, name: "click", vol: 0.5 }];
  window.__setup = async (data) => {
    const p = M.setup(data);
    const D = M.D, u = M.u;
    await M.bg($("bg"));
    $("shade").style.background = M.vertical
      ? "linear-gradient(180deg, rgba(5,10,20,.55) 0%, rgba(5,10,20,.15) 30%, rgba(5,10,20,.55) 58%, rgba(5,10,20,.92) 100%)"
      : "linear-gradient(90deg, rgba(5,10,20,.9) 0%, rgba(5,10,20,.6) 45%, rgba(5,10,20,.1) 100%)";
    M.text("place", D.place); M.text("kind", D.kind); M.text("trade", D.trade); M.text("price", D.price); M.text("brand", D.brand);
    chips = (D.chips || []).slice(0, 3).map((t) => { const s = document.createElement("span"); s.className = "chip"; s.textContent = t; $("chips").appendChild(s); return s; });
    if (M.vertical) { $("top").style.top = u * 18 + "px"; $("mid").style.bottom = u * 36 + "px"; }
    else { $("top").style.top = u * 9 + "px"; $("mid").style.top = M.H * 0.28 + "px"; $("mid").style.right = M.W * 0.3 + "px"; }
    await p;
    await window.__seek(0);
  };
  window.__seek = async (t) => {
    await M.bgSeek(t);
    const dur = M.D.seconds || 3;
    $("bg").style.transform = `scale(${1.12 - 0.1 * (t / dur)}) translateY(${-1.5 * (t / dur)}%)`;
    $("bg").style.filter = `brightness(${0.55 + 0.45 * outCubic(seg(t, 0, 0.5))})`;
    const p1 = outBack(seg(t, 0.15, 0.6));
    $("pin").style.transform = `rotate(-45deg) translate(${-(1 - p1) * 60}%, ${-(1 - p1) * 160}%)`;
    $("pin").style.opacity = String(seg(t, 0.15, 0.3));
    const p2 = outCubic(seg(t, 0.3, 0.75));
    $("place").style.transform = `translateX(${(1 - p2) * -30}px)`; $("place").style.opacity = String(p2);
    $("kind").style.transform = `translateY(${(1 - outCubic(seg(t, 0.45, 0.95))) * 105}%)`;
    const p4 = outBack(seg(t, 0.85, 1.2));
    $("trade").style.transform = `scale(${0.4 + 0.6 * p4})`; $("trade").style.opacity = String(seg(t, 0.85, 0.95));
    const p5 = outCubic(seg(t, 0.95, 1.4));
    $("price").style.transform = `translateY(${(1 - p5) * 105}%) scale(${1 + 0.06 * Math.sin(Math.PI * seg(t, 1.3, 1.7))})`;
    $("bar").style.transform = `scaleX(${inOut(seg(t, 1.35, 1.8))})`;
    chips.forEach((c, i) => { const q = outBack(seg(t, 1.6 + i * 0.15, 1.95 + i * 0.15)); c.style.opacity = String(seg(t, 1.6 + i * 0.15, 1.75 + i * 0.15)); c.style.transform = `translateY(${(1 - q) * 40}px) scale(${0.85 + 0.15 * q})`; });
    $("brand").style.opacity = String(0.9 * outCubic(seg(t, 0.2, 0.7)));
    const s = seg(t, 1.4, 2.2);
    $("sweep").style.transform = `translateX(${-100 + 200 * s}%)`; $("sweep").style.opacity = s > 0 && s < 1 ? "1" : "0";
  };
</script>
</body>
</html>
