<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 장면 · 인용 카드 — 큰 따옴표가 떨어지고 문구가 한 줄씩, 아래 말한 사람 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #shade { position: absolute; inset: 0; }
  .hl { color: var(--accent); }
  #shade { background: rgba(5,8,16,.55); }
  #box { position: absolute; left: var(--pad); right: var(--pad); }
  #q { font-size: calc(var(--u) * 26); font-weight: 900; color: var(--accent); line-height: .7; height: calc(var(--u) * 12); font-family: Georgia, serif; }
  #t { font-size: calc(var(--u) * 8); font-weight: 900; line-height: 1.3; }
  #who { margin-top: calc(var(--u) * 3); font-size: calc(var(--u) * 4.2); font-weight: 700; opacity: .85; }
  #who::before { content: ""; display: inline-block; width: calc(var(--u) * 6); height: calc(var(--u) * .5); background: var(--accent); vertical-align: middle; margin-right: calc(var(--u) * 1.5); }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="shade"></div><div id="box"><div id="q">“</div><div id="t"></div><div id="who"></div></div></div>
<script src="vendor/anime.umd.min.js"></script>
<script src="base.js"></script>
<script src="scene-common.js"></script>
<script>
  const { $ } = M;
  const { stagger } = anime;
  window.__SFX = [{ t: 0.15, name: "whoosh-short", vol: 0.5 }, { t: 0.4, name: "pop", vol: 0.5 }];
  window.__setup = async (data) => {
    await S.start(data); const tl = S.tl; const D = M.D, u = M.u, V = M.vertical;
    const ws = S.words($("t"), D.title, D.highlight); M.text("who", D.sub);
    $("box").style.top = (V ? M.H * 0.2 : M.H * 0.18) + "px";
    S.hide($("q"), ws, $("who"));
    tl.add($("q"), { opacity: [0, 1], y: [-u * 12, 0], rotate: [-20, 0], duration: 600, ease: "outBounce" }, 100)
      .add(ws, { opacity: [0, 1], y: [u * 3, 0], scale: [0.85, 1], duration: 500, delay: stagger(90) }, 450)
      .add($("who"), { opacity: [0, 0.85], x: [-u * 4, 0], duration: 500 }, 450 + ws.length * 90 + 200);
    await window.__seek(0);
  };
</script>
</body>
</html>
