<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 강조 · 줌 펀치 — 화면이 확 다가오며 흔들리고 번쩍, 강조 낱말이 크게 쾅 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #shade { position: absolute; inset: 0; }
  .hl { color: var(--accent); }
  #shade { background: rgba(0,0,0,.3); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #t { position: absolute; left: var(--pad); right: var(--pad); text-align: center; font-size: calc(var(--u) * 14); font-weight: 900; line-height: 1.1; -webkit-text-stroke: calc(var(--u) * .5) #000; paint-order: stroke fill; }
  #t .hl { color: var(--accent); }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="shade"></div><div id="t"></div><div id="flash"></div></div>
<script src="vendor/anime.umd.min.js"></script>
<script src="base.js"></script>
<script src="scene-common.js"></script>
<script>
  const { $ } = M;
  const { stagger } = anime;
  window.__SFX = [{ t: 0.0, name: "whoosh-short", vol: 0.6 }, { t: 0.18, name: "impact-bass-1", vol: 0.9 }];
  window.__setup = async (data) => {
    await S.start(data); const tl = S.tl; const D = M.D, u = M.u, V = M.vertical;
    const ws = S.words($("t"), D.highlight && String(D.title).includes(D.highlight) ? D.title.split(/\s+/).slice(0, 4).join(" ") : D.title.split(/\s+/).slice(0, 4).join(" "), D.highlight);
    $("t").style.top = (V ? M.H * 0.24 : M.H * 0.3) + "px";
    S.hide(ws);
    tl.add($("bg"), { scale: [1.0, 1.28], duration: 180, ease: "outQuad" }, 0)
      .add($("bg"), { translateX: [0, u * 2, -u * 2, u * 1, 0], translateY: [0, -u * 1.5, u * 1.5, 0], duration: 350, ease: "linear" }, 180)
      .add($("flash"), { opacity: [0.7, 0], duration: 300, ease: "outQuad" }, 180)
      .add(ws, { opacity: [0, 1], scale: [2.6, 1], duration: 300, delay: stagger(60), ease: "outQuart" }, 180);
    await window.__seek(0);
  };
</script>
</body>
</html>
