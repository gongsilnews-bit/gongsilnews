<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 끝 화면 ④ 미니멀 — 흰 바탕, 가는 선, 사무소·전화·QR 이 차례로 밀려 들어온다 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #fff; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #111; background: #fafafa; }
  #wrap { position: absolute; left: var(--pad); right: var(--pad); }
  .mask { overflow: hidden; }
  #kicker { font-size: calc(var(--u) * 3.4); font-weight: 700; color: var(--accent); letter-spacing: .3em; }
  #brand { font-size: calc(var(--u) * 9.5); font-weight: 900; letter-spacing: -.03em; line-height: 1.2; }
  .rule { height: 2px; background: #111; margin: calc(var(--u) * 3) 0; transform-origin: left center; }
  #info { font-size: calc(var(--u) * 3.3); color: #555; line-height: 1.7; white-space: pre-line; }
  #row { display: flex; align-items: flex-end; justify-content: space-between; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 5); }
  #phone { font-size: calc(var(--u) * 9); font-weight: 900; letter-spacing: -.02em; white-space: nowrap; }
  #qr { width: calc(var(--u) * 20); height: calc(var(--u) * 20); }
  #dot { display: inline-block; width: calc(var(--u) * 2); height: calc(var(--u) * 2); border-radius: 50%; background: var(--accent); margin-right: calc(var(--u) * 1); vertical-align: middle; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <div class="mask"><div id="kicker">CONTACT</div></div>
    <div class="mask"><div id="brand"></div></div>
    <div class="rule" id="r1"></div>
    <div id="info"></div>
    <div id="row"><div class="mask"><div id="phone"><span id="dot"></span><span id="phoneT"></span></div></div><img id="qr" alt=""></div>
  </div>
</div>
<script src="base.js"></script>
<script>
  const { $, seg, outCubic, outExpo } = M;
  window.__SFX = [{ t: 0.1, name: "whoosh-short", vol: 0.5 }, { t: 0.6, name: "click", vol: 0.5 }, { t: 1.0, name: "click", vol: 0.5 }, { t: 1.4, name: "ping", vol: 0.4 }];
  window.__setup = async (data) => {
    const p = M.setup(data); const D = M.D;
    $("kicker").textContent = "문의";
    M.text("brand", D.brand || "공실뉴스"); M.text("info", D.info); $("phoneT").textContent = D.phone || "";
    if (!D.phone) $("phone").style.display = "none";
    if (D.qr) $("qr").src = D.qr; else $("qr").style.display = "none";
    $("wrap").style.top = (M.vertical ? M.H * 0.26 : M.H * 0.16) + "px";
    if (!M.vertical) { $("wrap").style.left = M.W * 0.2 + "px"; $("wrap").style.right = M.W * 0.2 + "px"; }
    await p; await window.__seek(0);
  };
  window.__seek = async (t) => {
    [["kicker", 0.1], ["brand", 0.25], ["phone", 1.0]].forEach(([id, a]) => { $(id).style.transform = `translateY(${(1 - outCubic(seg(t, a, a + 0.45))) * 105}%)`; });
    $("r1").style.transform = `scaleX(${outExpo(seg(t, 0.55, 1.0))})`;
    $("info").style.opacity = String(outCubic(seg(t, 0.7, 1.1)));
    const q = outCubic(seg(t, 1.3, 1.7)); $("qr").style.opacity = String(q); $("qr").style.transform = `translateY(${(1 - q) * 20}px)`;
  };
</script>
</body>
</html>
