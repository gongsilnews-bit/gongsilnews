<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 장면 · 메모지 — 포스트잇이 휙 날아와 붙고 손글씨처럼 글이 적힌다 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #shade { position: absolute; inset: 0; }
  .hl { color: var(--accent); }
  #shade { background: rgba(0,0,0,.15); }
  #note { position: absolute; background: #ffe680; color: #222; padding: calc(var(--u) * 4); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 4) rgba(0,0,0,.35); width: calc(var(--u) * 60); }
  #note::before { content: ""; position: absolute; left: 35%; top: calc(var(--u) * -2); width: 30%; height: calc(var(--u) * 4); background: rgba(255,255,255,.55); }
  #t { font-size: calc(var(--u) * 7.4); font-weight: 900; line-height: 1.3; }
  #sub { font-size: calc(var(--u) * 4.2); font-weight: 700; margin-top: calc(var(--u) * 2); color: #555; }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="shade"></div><div id="note"><div id="t"></div><div id="sub"></div></div></div>
<script src="vendor/anime.umd.min.js"></script>
<script src="base.js"></script>
<script src="scene-common.js"></script>
<script>
  const { $ } = M;
  const { stagger } = anime;
  window.__SFX = [{ t: 0.05, name: "whoosh", vol: 0.6 }, { t: 0.45, name: "click", vol: 0.6 }, { t: 0.6, name: "typing", vol: 0.3 }];
  window.__setup = async (data) => {
    await S.start(data); const tl = S.tl; const D = M.D, u = M.u, V = M.vertical;
    const cs = S.chars($("t"), D.title); M.text("sub", D.sub);
    Object.assign($("note").style, V ? { left: (M.W - u * 60) / 2 + "px", top: M.H * 0.16 + "px" } : { left: M.W * 0.55 + "px", top: M.H * 0.2 + "px" });
    S.hide($("note"), cs, $("sub"));
    tl.add($("note"), { opacity: [0, 1], x: [u * 60, 0], y: [-u * 30, 0], rotate: [25, -3], duration: 650, ease: "outBack(1.3)" }, 0)
      .add(cs, { opacity: [0, 1], duration: 1, delay: stagger(45) }, 600)
      .add($("sub"), { opacity: [0, 1], duration: 400 }, 600 + cs.length * 45 + 100);
    await window.__seek(0);
  };
</script>
</body>
</html>
