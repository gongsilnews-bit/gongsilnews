<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 인트로 ⑦ 타자기 — 사진 위 하얀 메모지에 글이 한 글자씩 쳐지고 커서가 깜빡인다 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #222; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #1b1b1b; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #shade { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
  #paper { position: absolute; left: var(--pad); right: var(--pad); background: #fffdf6; border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 5) calc(var(--u) * 5); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0,0,0,.4); }
  #paper::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 1.4); background: var(--accent); border-radius: calc(var(--u) * 1) calc(var(--u) * 1) 0 0; }
  .ln { font-size: calc(var(--u) * 5); font-weight: 700; line-height: 1.5; white-space: pre-wrap; min-height: 1.5em; }
  #l2 { font-size: calc(var(--u) * 8.5); font-weight: 900; line-height: 1.25; }
  #l3 { font-size: calc(var(--u) * 11); font-weight: 900; color: var(--accent); line-height: 1.2; }
  #l4 { font-size: calc(var(--u) * 4); font-weight: 600; color: #555; margin-top: calc(var(--u) * 1.5); }
  .cur { display: inline-block; width: .08em; height: 1em; background: #1b1b1b; vertical-align: -0.12em; margin-left: .05em; }
  #brand { position: absolute; right: var(--pad); top: var(--pad); color: #fff; font-size: calc(var(--u) * 3.6); font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="shade"></div><div id="brand"></div>
  <div id="paper"><div class="ln" id="l1"></div><div class="ln" id="l2"></div><div class="ln" id="l3"></div><div class="ln" id="l4"></div></div>
</div>
<script src="base.js"></script>
<script>
  const { $, seg, outBack } = M;
  window.__SFX = [{ t: 0.05, name: "whoosh-short", vol: 0.5 }, { t: 0.35, name: "typing", vol: 0.55 }, { t: 1.3, name: "typing", vol: 0.55 }, { t: 2.05, name: "ping", vol: 0.6 }];
  let lines = [];
  window.__setup = async (data) => {
    const p = M.setup(data); const D = M.D, u = M.u;
    await M.bg($("bg"));
    lines = [[ "l1", D.place, 0.35, 0.75 ], [ "l2", D.kind, 0.75, 1.25 ], [ "l3", [D.trade, D.price].filter(Boolean).join(" "), 1.3, 1.9 ], [ "l4", (D.chips || []).slice(0, 3).join(" · "), 1.9, 2.4 ]];
    M.text("brand", D.brand);
    $("paper").style.top = (M.vertical ? M.H * 0.3 : M.H * 0.18) + "px";
    if (!M.vertical) { $("paper").style.right = "auto"; $("paper").style.width = M.W * 0.5 + "px"; }
    await p; await window.__seek(0);
  };
  window.__seek = async (t) => {
    await M.bgSeek(t);
    $("bg").style.transform = `scale(${1.08 - 0.05 * seg(t, 0, 3)})`;
    const q = outBack(seg(t, 0, 0.35));
    $("paper").style.opacity = String(seg(t, 0, 0.15));
    $("paper").style.transform = `translateY(${(1 - q) * 60}px) rotate(${(1 - q) * -3}deg)`;
    let active = -1;
    lines.forEach(([id, txt, a, b], i) => {
      const s = String(txt || "");
      const n = Math.round(s.length * seg(t, a, b));
      if (t >= a) active = i;
      $(id).textContent = s.slice(0, n);
    });
    // 커서 — 지금 치는 줄 끝에서 깜빡
    document.querySelectorAll(".cur").forEach((c) => c.remove());
    if (active >= 0 && Math.floor(t * 4) % 2 === 0) { const c = document.createElement("span"); c.className = "cur"; $(lines[active][0]).appendChild(c); }
    $("brand").style.opacity = String(seg(t, 0.3, 0.7));
  };
</script>
</body>
</html>
