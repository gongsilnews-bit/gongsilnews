<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 끝 화면 ① 기본 카드 — 흐린 사진 위 흰 카드: 사무소 · 표시광고 정보 · 전화 · QR (2026-10-28 사장님) -->
<style>
  html, body { margin: 0; overflow: hidden; background: #0b1220; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #111; }
  #bg { position: absolute; inset: -3%; overflow: hidden; }
  #shade { position: absolute; inset: 0; background: rgba(8,12,22,.6); }
  #card { position: absolute; left: var(--pad); right: var(--pad); background: #fff; border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 5); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 8) rgba(0,0,0,.45); }
  #top { display: flex; align-items: center; gap: calc(var(--u) * 1.5); }
  #bar { width: calc(var(--u) * 1.2); align-self: stretch; background: var(--accent); border-radius: 99px; }
  #brand { font-size: calc(var(--u) * 8); font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
  #info { font-size: calc(var(--u) * 3.3); color: #555; line-height: 1.6; margin-top: calc(var(--u) * 2.5); white-space: pre-line; }
  #row { display: flex; align-items: center; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 4); }
  #phoneBox { flex: 1; min-width: 0; }
  #callLabel { font-size: calc(var(--u) * 3.6); font-weight: 800; color: var(--accent); }
  #phone { font-size: calc(var(--u) * 9); font-weight: 900; letter-spacing: -.02em; white-space: nowrap; }
  #qrBox { text-align: center; flex-shrink: 0; }
  #qr { width: calc(var(--u) * 22); height: calc(var(--u) * 22); display: block; border-radius: calc(var(--u) * 1); border: calc(var(--u) * .4) solid #eee; }
  #qrLabel { font-size: calc(var(--u) * 2.8); font-weight: 800; margin-top: calc(var(--u) * 1); color: #333; }
  #recap { position: absolute; left: var(--pad); right: var(--pad); color: #fff; font-size: calc(var(--u) * 4.4); font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #cta { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-size: calc(var(--u) * 4); font-weight: 800; }
  #cta span { background: var(--accent); padding: calc(var(--u) * 1) calc(var(--u) * 3); border-radius: 99px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="shade"></div>
  <div id="recap"></div>
  <div id="card">
    <div id="top"><div id="bar"></div><div id="brand"></div></div>
    <div id="info"></div>
    <div id="row"><div id="phoneBox"><div id="callLabel">상담 · 문의</div><div id="phone"></div></div><div id="qrBox"><img id="qr" alt=""><div id="qrLabel">사진·위치 보기</div></div></div>
  </div>
  <div id="cta"><span id="ctaT"></span></div>
</div>
<script src="base.js"></script>
<script>
  const { $, seg, outCubic, outBack } = M;
  window.__SFX = [{ t: 0.05, name: "whoosh", vol: 0.6 }, { t: 0.55, name: "pop", vol: 0.6 }, { t: 1.0, name: "ping", vol: 0.6 }, { t: 1.6, name: "chime", vol: 0.5 }];
  window.__setup = async (data) => {
    const p = M.setup(data); const D = M.D, u = M.u;
    await M.bg($("bg"));
    M.text("brand", D.brand || "공실뉴스"); M.text("info", D.info); M.text("phone", D.phone);
    $("callLabel").style.display = D.phone ? "" : "none";
    if (D.qr) $("qr").src = D.qr; else $("qrBox").style.display = "none";
    $("recap").textContent = [D.place, D.kind, [D.trade, D.price].filter(Boolean).join(" ")].filter(Boolean).join(" · ");
    $("ctaT").textContent = D.cta || "자세한 사진·위치는 공실뉴스에서";
    if (M.vertical) { $("card").style.top = M.H * 0.3 + "px"; $("recap").style.top = M.H * 0.2 + "px"; $("cta").style.bottom = u * 30 + "px"; }
    else { $("card").style.top = M.H * 0.2 + "px"; $("card").style.left = M.W * 0.18 + "px"; $("card").style.right = M.W * 0.18 + "px"; $("recap").style.top = u * 7 + "px"; $("cta").style.bottom = u * 6 + "px"; }
    await Promise.all([p, D.qr ? new Promise((r) => { const im = $("qr"); if (im.complete) r(); else im.onload = im.onerror = r; }) : null]);
    await window.__seek(0);
  };
  window.__seek = async (t) => {
    await M.bgSeek(t);
    $("bg").style.filter = `blur(${M.u * 0.8}px)`; $("bg").style.transform = `scale(${1.05 + 0.04 * seg(t, 0, 3)})`;
    const r = outCubic(seg(t, 0.0, 0.4)); $("recap").style.opacity = String(r); $("recap").style.transform = `translateY(${(1 - r) * -20}px)`;
    const c = outBack(seg(t, 0.1, 0.6)); $("card").style.opacity = String(seg(t, 0.1, 0.2)); $("card").style.transform = `translateY(${(1 - c) * M.u * 20}px) scale(${0.94 + 0.06 * c})`;
    $("bar").style.transform = `scaleY(${outCubic(seg(t, 0.4, 0.7))})`;
    const i = outCubic(seg(t, 0.55, 0.9)); $("info").style.opacity = String(i);
    const ph = outBack(seg(t, 0.8, 1.2)); $("phone").style.transform = `scale(${0.85 + 0.15 * ph})`; $("phone").style.transformOrigin = "left center"; $("phone").style.opacity = String(seg(t, 0.8, 0.9));
    const q = outBack(seg(t, 1.0, 1.4)); $("qrBox").style.transform = `scale(${0.6 + 0.4 * q}) rotate(${(1 - q) * -8}deg)`; $("qrBox").style.opacity = String(seg(t, 1.0, 1.1));
    const ct = outCubic(seg(t, 1.5, 1.9)); $("cta").style.opacity = String(ct); $("cta").style.transform = `translateY(${(1 - ct) * 30}px)`;
  };
</script>
</body>
</html>
