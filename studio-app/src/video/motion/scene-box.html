<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 장면 · 테두리 상자 — 문구 둘레에 선이 그려지며 감싸고 글자가 차오른다 -->
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #stage { position: relative; overflow: hidden; font-family: "GsFont", "Pretendard", "Malgun Gothic", sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #shade { position: absolute; inset: 0; }
  .hl { color: var(--accent); }
  #shade { background: rgba(0,0,0,.35); }
  #box { position: absolute; left: var(--pad); right: var(--pad); padding: calc(var(--u) * 5) calc(var(--u) * 4); text-align: center; }
  #box svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #t { position: relative; font-size: calc(var(--u) * 9); font-weight: 900; line-height: 1.25; }
  #sub { position: relative; font-size: calc(var(--u) * 4.4); font-weight: 700; margin-top: calc(var(--u) * 2); opacity: .9; }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="shade"></div><div id="box"><svg preserveAspectRatio="none"><rect id="r" x="2" y="2" fill="none" stroke-width="6" rx="18"></rect></svg><div id="t"></div><div id="sub"></div></div></div>
<script src="vendor/anime.umd.min.js"></script>
<script src="base.js"></script>
<script src="scene-common.js"></script>
<script>
  const { $ } = M;
  const { stagger } = anime;
  window.__SFX = [{ t: 0.1, name: "whoosh", vol: 0.5 }, { t: 0.8, name: "ping", vol: 0.5 }];
  window.__setup = async (data) => {
    await S.start(data); const tl = S.tl; const D = M.D, u = M.u, V = M.vertical;
    const cs = S.chars($("t"), D.title); M.text("sub", D.sub);
    $("box").style.top = (V ? M.H * 0.22 : M.H * 0.24) + "px";
    const b = $("box").getBoundingClientRect(); const r = $("r");
    r.setAttribute("width", b.width - 4); r.setAttribute("height", b.height - 4); r.setAttribute("stroke", getComputedStyle($("stage")).getPropertyValue("--accent").trim() || "#E8590C");
    $("box").querySelector("svg").setAttribute("viewBox", `0 0 ${b.width} ${b.height}`);
    S.hide(cs, $("sub"));
    const [dr] = anime.svg.createDrawable(r);
    tl.add(dr, { draw: ["0 0", "0 1"], duration: 900, ease: "inOutCubic" }, 0)
      .add(cs, { opacity: [0, 1], y: [u * 2, 0], duration: 350, delay: stagger(35) }, 350)
      .add($("sub"), { opacity: [0, 0.9], duration: 500 }, 350 + cs.length * 35 + 150);
    await window.__seek(0);
  };
</script>
</body>
</html>
