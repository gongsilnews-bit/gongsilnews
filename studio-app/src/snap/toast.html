<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>찍었어요</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Pretendard", "Malgun Gothic", sans-serif; user-select: none; }
  .box { position: absolute; inset: 4px; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: rgba(17, 20, 28, 0.96); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 8px 24px rgba(0,0,0,0.45); color: #e5e7eb; }
  .top { display: flex; align-items: center; gap: 8px; }
  .ok { width: 20px; height: 20px; border-radius: 10px; background: #16a34a; color: #fff; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ok.err { background: #dc2626; }
  .t { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 800; }
  .x { width: 26px; height: 26px; border: none; border-radius: 6px; background: transparent; color: #9ca3af; font-size: 16px; cursor: pointer; }
  .x:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .name { font-size: 12px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clip { font-size: 12px; color: #86efac; }
  .thumb { flex: 1; min-height: 0; border-radius: 6px; background: #000 center/contain no-repeat; }
  .btns { display: flex; gap: 6px; }
  .btns button { flex: 1; height: 32px; border: 1px solid rgba(255,255,255,0.18); border-radius: 7px; background: transparent; color: #e5e7eb; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .btns button:hover { background: rgba(255,255,255,0.1); }
  .btns button.main { background: #2563eb; border-color: #2563eb; color: #fff; }
</style>
</head>
<body>
<div class="box" id="box"></div>
<script>
// 찍은 뒤 알림 — 클립보드에 들어갔다고 알리고, 이미지제작·폴더로 바로 (캡처·녹화에 안 찍힌다)
let timer = null;
const later = () => { clearTimeout(timer); timer = setTimeout(() => window.snap.cmd("toast-close"), 8000); };
document.addEventListener("mouseenter", () => clearTimeout(timer));
document.addEventListener("mouseleave", later);
window.snap.init().then((r) => {
  const b = document.getElementById("box");
  const err = r.kind === "error";
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  b.innerHTML = `
    <div class="top"><span class="ok${err ? " err" : ""}">${err ? "!" : "✓"}</span><span class="t">${err ? esc(r.name) : r.kind === "video" ? "녹화했어요" : "찍었어요"}</span><button class="x" id="x" title="닫기">✕</button></div>
    ${err ? `<div class="name" style="white-space:normal">${esc(r.size)}</div>` : `<div class="name" title="${esc(r.file)}">${esc(r.name)} · ${esc(r.size)}</div>
    <div class="clip">${r.kind === "video" ? "클립보드에 파일로 복사했어요 — 카톡에 Ctrl+V" : "클립보드에 복사했어요 — 카톡·이미지제작에 Ctrl+V"}</div>`}
    ${r.thumb ? `<div class="thumb" style="background-image:url('${r.thumb}')"></div>` : ""}
    ${err ? "" : `<div class="btns">${r.kind === "image" ? `<button class="main" id="p">이미지제작에서 열기</button>` : `<button class="main" id="o">영상 보기</button>`}<button id="f">폴더에서 보기</button></div>`}`;
  document.getElementById("x").onclick = () => window.snap.cmd("toast-close");
  const on = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = fn; };
  on("p", () => window.snap.cmd("toast-photo", r.file));
  on("o", () => window.snap.cmd("toast-open", r.file));
  on("f", () => window.snap.cmd("toast-reveal", r.file));
  later();
});
</script>
</body>
</html>
