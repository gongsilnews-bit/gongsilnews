<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>녹화 영역</title>
<style>
  /* 영역 녹화 테두리 — 고른 곳 바로 바깥에 빨간 점선 (녹화에는 안 찍힘, 마우스는 그대로 지나감) */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  div { position: fixed; inset: 0; border: 3px dashed #ef4444; border-radius: 3px; box-sizing: border-box; }
</style>
</head>
<body><div></div></body>
</html>
